name: ✨ Feature Request
description: Sugerir uma nova funcionalidade ou melhoria
labels: ['type: feat', 'status: needs-info']
body:
    - type: markdown
      attributes:
          value: |
              Descreva a funcionalidade que gostaria de ver implementada.

    - type: textarea
      id: problem
      attributes:
          label: Problema ou necessidade
          description: Qual problema esta funcionalidade resolve?
      validations:
          required: true

    - type: textarea
      id: solution
      attributes:
          label: Solução proposta
          description: Descreva como você imagina que esta funcionalidade deveria funcionar.
      validations:
          required: true

    - type: textarea
      id: alternatives
      attributes:
          label: Alternativas consideradas
          description: Alguma alternativa que você já tentou ou considerou?

    - type: textarea
      id: context
      attributes:
          label: Contexto adicional
          description: Mockups, referências ou qualquer informação adicional.

    - type: dropdown
      id: priority
      attributes:
          label: Prioridade sugerida
          options:
              - 'priority: high'
              - 'priority: medium'
              - 'priority: low'
      validations:
          required: true

    - type: dropdown
      id: area
      attributes:
          label: Área relacionada
          options:
              - 'area: auth'
              - 'area: tenant'
              - 'area: ledger'
              - 'area: database'
              - 'area: infra'
              - 'area: api'
              - 'area: security'
      validations:
          required: true
