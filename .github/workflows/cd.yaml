name: CD

on:
    workflow_run:
        workflows: ['CI']
        branches: [main]
        types:
            - completed

jobs:
    deploy:
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        runs-on: ubuntu-latest
        name: Deploy to VPS

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and Push Docker Image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/api-kontal:latest
                      ghcr.io/${{ github.repository_owner }}/api-kontal:${{ github.event.workflow_run.head_sha }}

            - name: Deploy on VPS
              uses: appleboy/ssh-action@v1.2.0
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  script: |
                      set -e

                      cd /srv/kontal/

                      NEW_TAG="${{ github.event.workflow_run.head_sha }}"
                      SERVICE="api-kontal"
                      ENV_FILE=".env"

                      echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

                      CURRENT_TAG=$(grep '^API_KONTAL_TAG=' "$ENV_FILE" | cut -d '=' -f2)

                      echo "Tag atual: $CURRENT_TAG"
                      echo "Nova tag: $NEW_TAG"

                      cp "$ENV_FILE" "${ENV_FILE}.bak"

                      sed -i "s/^API_KONTAL_TAG=.*/API_KONTAL_TAG=$NEW_TAG/" "$ENV_FILE"

                      docker compose pull "$SERVICE"
                      docker compose up -d --force-recreate "$SERVICE"

                      echo "Aguardando aplicação subir..."
                      sleep 10

                      # O boot inclui as migrations do Prisma; tenta várias vezes antes de desistir.
                      HEALTHY=false
                      for i in $(seq 1 12); do
                        if curl -fk -s -o /dev/null "https://${{ secrets.API_DOMAIN }}/api/v1/health"; then
                          HEALTHY=true
                          break
                        fi
                        echo "Healthcheck tentativa $i/12 falhou, aguardando 5s..."
                        sleep 5
                      done

                      if [ "$HEALTHY" = "true" ]; then
                        echo "Deploy validado com sucesso."
                        rm -f "${ENV_FILE}.bak"
                      else
                        echo "Falha no healthcheck após 12 tentativas. Iniciando rollback..."
                        mv "${ENV_FILE}.bak" "$ENV_FILE"
                        docker compose pull "$SERVICE"
                        docker compose up -d --force-recreate "$SERVICE"
                        exit 1
                      fi
