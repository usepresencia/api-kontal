name: CI

on:
    push:
        branches: ['develop', 'main']
    pull_request:
        branches: ['develop', 'main']

jobs:
    build:
        runs-on: ubuntu-latest
        name: Validate, Lint, Build (NestJS)
        env:
            DATABASE_URL: postgresql://kontal:kontal@localhost:5432/kontal?schema=public
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: kontal
                    POSTGRES_PASSWORD: kontal
                    POSTGRES_DB: kontal
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U kontal -d kontal"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Fetch PR commits
              if: github.event_name == 'pull_request'
              run: |
                  git fetch --no-tags --prune origin "${{ github.event.pull_request.base.ref }}"
                  git fetch --no-tags --prune origin "pull/${{ github.event.pull_request.number }}/head:pr"

            - name: Validate Commit Messages
              if: github.event_name == 'pull_request'
              run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to pr --verbose

            - name: Generate Prisma Client
              run: npm run prisma:generate

            - name: Lint code
              run: npm run lint

            - name: Check code formatting
              run: npx prettier '**/*.{css,scss,yaml,yml,ts,js,jsx,tsx,json,md}' --check

            - name: Run tests with coverage
              run: npm run test:cov

            - name: Build project
              run: npm run build

            - name: Apply migrations
              run: npm run prisma:deploy

            - name: Setup Java (Firebase Emulators)
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21

            - name: Cache Firebase Emulators
              uses: actions/cache@v4
              with:
                  path: ~/.cache/firebase/emulators
                  key: firebase-emulators-${{ hashFiles('package-lock.json') }}

            - name: Run e2e tests
              run: npm run test:e2e

    release:
        runs-on: ubuntu-latest
        name: Release
        needs: build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Configure Git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Release
              run: |
                  npm run release
                  git push --follow-tags origin main
